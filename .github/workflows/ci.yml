name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Run serde tests
        run: cargo test --features serde --verbose

      - name: Check fuzz workspace
        run: cargo check
        working-directory: fuzz

  build-matrix:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # os: [ubuntu-latest, macos-latest]
        rust: [stable]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Run serde tests
        run: cargo test --features serde --verbose

  c-lib-test:
    name: C Library Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: c-lib-test-${{ runner.os }}-${{ hashFiles('libbitcoinpqc/**') }}
          restore-keys: |
            c-lib-test-${{ runner.os }}-

      - name: Configure and build C library
        run: |
          cmake -B build -S libbitcoinpqc -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run C tests
        run: ctest --test-dir build --output-on-failure

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: python-test-${{ runner.os }}-${{ hashFiles('libbitcoinpqc/**') }}
          restore-keys: |
            python-test-${{ runner.os }}-

      - name: Build C library
        run: |
          cmake -B build -S libbitcoinpqc -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v
        working-directory: python

  nodejs-test:
    name: NodeJS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nodejs/package-lock.json

      - name: Install, build, and test
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
        working-directory: nodejs

