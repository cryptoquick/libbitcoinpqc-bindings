[package]
name = "bitcoinpqc"
version = "0.4.0"
edition = "2021"
authors = ["Hunter Beast <hunter@surmount.systems>"]
description = "Tapscript signature algorithms for Bitcoin P2MR (BIP 360): secp256k1 Schnorr, ML-DSA-44, and SLH-DSA-SHA2-128s"
repository = "https://github.com/bitcoin/libbitcoinpqc"
license = "MIT"
keywords = ["bitcoin", "cryptography", "bip360", "p2mr", "tapscript"]

[dependencies]
hex = "0.4"
libc = "0.2"
bitmask-enum = "2.2.5"
# Direct dep so getrandom's wasm_js backend unifies with --cfg getrandom_backend="wasm_js" in .cargo/config.toml.
getrandom = { version = "0.3", features = ["wasm_js"] }
criterion = { version = "0.5", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
secp256k1 = { version = "0.31.0", default-features = false, features = [
    "global-context",
    "rand",
] }

[build-dependencies]
bindgen = "0.71.1"
cc = "1.2"
cmake = "0.1"

[dev-dependencies]
hex = "0.4"
rand = "0.9"
serde_json = "1.0"
wasm-bindgen-test = "0.3"

[features]
default = []
bench = ["dep:criterion"]
# Enable this feature in your IDE for better code completion
# but never use it for actual builds
ide = []
# Define the serde feature
serde = ["dep:serde", "secp256k1/serde"]

[lib]
name = "bitcoinpqc"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bench]]
name = "sig_benchmarks"
harness = false
required-features = ["bench"]
